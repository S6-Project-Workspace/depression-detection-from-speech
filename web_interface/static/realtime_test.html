<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Depression Detection Testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #fee2e2;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .recording-indicator.active {
            display: flex;
        }

        .recording-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .file-upload {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .file-upload input {
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .result-card {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .result-label {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-label.depressed {
            color: #ef4444;
        }

        .result-label.non-depressed {
            color: #10b981;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s;
        }

        .probabilities {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
        }

        .model-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .model-badge {
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-indicator {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .status-indicator.show {
            display: block;
        }

        .status-indicator.loading {
            background: #fef3c7;
            color: #92400e;
        }

        .status-indicator.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status-indicator.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .model-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .model-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-selector label:hover {
            background: #e0e0e0;
        }

        .model-selector input:checked + span {
            font-weight: 600;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Real-Time Depression Detection</h1>
            <p>Test all trained models with text and audio input</p>
        </div>

        <div class="main-grid">
            <!-- Input Section -->
            <div class="card">
                <h2>📝 Input</h2>
                
                <div class="input-section">
                    <label for="textInput">Text Input (Tamil/Malayalam)</label>
                    <textarea id="textInput" placeholder="Enter text in Tamil or Malayalam..."></textarea>
                </div>

                <div class="input-section">
                    <label>Audio Input</label>
                    <div class="recording-indicator" id="recordingIndicator">
                        <div class="recording-dot"></div>
                        <span>Recording... <span id="recordingTime">0:00</span></span>
                    </div>
                    <div class="audio-controls">
                        <button class="btn-danger" id="recordBtn">🎤 Record Audio</button>
                        <button class="btn-secondary" id="stopBtn" disabled>⏹️ Stop</button>
                        <button class="btn-secondary" id="playBtn" disabled>▶️ Play</button>
                    </div>
                    <div class="file-upload" id="fileUpload">
                        <input type="file" id="audioFile" accept="audio/*">
                        <p>📁 Or click to upload audio file</p>
                        <small>Supported: WAV, MP3, OGG</small>
                    </div>
                </div>

                <div class="input-section">
                    <label>Select Models to Test</label>
                    <div class="model-selector">
                        <label>
                            <input type="checkbox" id="modelTfidf" checked>
                            <span>TF-IDF</span>
                        </label>
                        <label>
                            <input type="checkbox" id="modelText" checked>
                            <span>MuRIL Text</span>
                        </label>
                        <label>
                            <input type="checkbox" id="modelAudio" checked>
                            <span>Audio</span>
                        </label>
                        <label>
                            <input type="checkbox" id="modelEnhanced" checked>
                            <span>Enhanced Multimodal</span>
                        </label>
                    </div>
                </div>

                <button class="btn-primary" id="predictBtn" style="width: 100%;">
                    🚀 Run Prediction
                </button>

                <div class="status-indicator" id="statusIndicator"></div>
            </div>

            <!-- Results Section -->
            <div class="card">
                <h2>📊 Results</h2>
                <div id="resultsContainer">
                    <p style="text-align: center; color: #999; padding: 40px 0;">
                        Results will appear here after prediction
                    </p>
                </div>
            </div>
        </div>

        <!-- All Results Grid -->
        <div class="card">
            <h2>🔍 Detailed Comparison</h2>
            <div class="results-grid" id="detailedResults"></div>
        </div>
    </div>

    <script>

        let recordedBlob;
        let recordingStartTime;
        let recordingInterval;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAvailableModels();
            setupEventListeners();
        });
